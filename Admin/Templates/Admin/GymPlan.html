{% extends 'Admin/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlan</title>
    <style>
        td{
            color: aliceblue;
        }
    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 90%;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a; /* black background */
        color: #2a2a2a; /* white text */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    table th, table td {
        border: 1px solid #ff0000; /* red borders */
        padding: 12px 15px;
        text-align: center;
    }

    table tr:nth-child(even) {
        background-color: #2a2a2a;
    }

    table tr:hover {
        background-color: #400000; /* dark red on hover */
    }

    table th {
        background-color: #ff0000;
        color: #2a2a2a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
    <h1 align="center">Gymplan</h1>
    <form action="" method="post">
        {% csrf_token %}
        <table class="table table-border table-hover">
            <tr>
                <td>Details</td>
                <td><input type="text" name="txt_details" id="txt_details" class="form-control" value="{{editgymplan.gymplan_details}}" required placeholder="enter details"></td>
            </tr>
            <tr>
                <td>Amount</td>
                <td><input type="text" name="txt_amount" id="txt_amount" class="form-control" value="{{editgymplan.gymplan_amount}}" required placeholder="enter amount"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" class="btn btn-outline-primary" value="submit"></td>
                <td></td>
            </tr>
        </table>
        <br>
        <table class="table table-border table-hover">
            <tr>
                <td>SL NO</td>
                <td>Details</td>
                <td>Amount</td>
                <td>Action</td>
            </tr>
            {% for i in gis %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.gymplan_details}}</td>
                <td>{{i.gymplan_amount}}</td>
               
                <td><a href="{% url 'Admin:delgymplan' i.id %}">Delete</a>
                <a href="{% url 'Admin:editgymplan' i.id %}">Edit</a></td>
            </tr>
            {% endfor %}
        </table>
    </form>
    
</body>
</html>
{%if msg%}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:GymPlan' %}"
</script>
{%endif%}
{% endblock %}
