{% extends 'Admin/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reply</title>
    <style>
        td{
            color: aliceblue;
        }
    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 90%;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a; /* black background */
        color: #2a2a2a; /* white text */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    table th, table td {
        border: 1px solid #ff0000; /* red borders */
        padding: 12px 15px;
        text-align: center;
    }

    table tr:nth-child(even) {
        background-color: #2a2a2a;
    }

    table tr:hover {
        background-color: #400000; /* dark red on hover */
    }

    table th {
        background-color: #ff0000;
        color: #2a2a2a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
    <h1 align="center">Reply</h1>
    <form action="" method="post">
        {%csrf_token%}
        <table class="table table-border table-hover">
            <tr>
                <td>Reply</td>
                <td><textarea name="txt_reply" class="form-control" id="txt_reply" required placeholder="enter reply"></textarea></td>
            </tr>
            <tr>
                <td><input type="submit"  class="btn btn-outline-primary" name="Submit"></td>
                <td></td>
            </tr>
        </table>
    </form>
</body>
</html>
{% endblock %}
