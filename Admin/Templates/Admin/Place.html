{% extends 'Admin/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>place</title>
    <style>
        td{
            color: aliceblue;
        }
    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 90%;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a; /* black background */
        color: #2a2a2a; /* white text */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    table th, table td {
        border: 1px solid #ff0000; /* red borders */
        padding: 12px 15px;
        text-align: center;
    }

    table tr:nth-child(even) {
        background-color: #2a2a2a;
    }

    table tr:hover {
        background-color: #400000; /* dark red on hover */
    }

    table th {
        background-color: #ff0000;
        color: #2a2a2a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
    <h1 align="center">Place</h1>
    <form action="" method="post">
        {% csrf_token %}
        <table class="table table-border table-hover">
            <tr>
                <td>District</td>
                <td><select name="sel_district" id="" class="form-control" required >
                   <option value="select">--select--</option>
                    {% for i in data %}
                    <option 
                    {% if i.id == editplace.district_id  %}
                    selected
                    {% endif %}
                    value="{{i.id}}">{{i.district_name}}</option>
                    {% endfor %}
                </select></td>
            </tr>
            <tr>
                <td>Place</td>
                <td><input type="text" name="txt_place"id=""  class="form-control" value="{{editplace.place_name}}"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" class="btn btn-outline-primary" value="Submit"></td>
            </tr>
        </table>
        <br>
            <table class="table table-border table-hover">
            <tr>
                <td>SL NO</td>
                <td>District</td>
                <td>Place</td>
                <td>Action</td>
            </tr>
            {% for i in plc %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.district.district_name}}</td>
                <td>{{i.place_name}}</td>
                <td><a href="{% url 'Admin:delplace' i.id %}">Delete</a></td>
                <td><a href="{% url 'Admin:editplace' i.id %}">Edit</a></td>
            </tr>
            {% endfor %}
        </table>
    </form>
    
</body>
</html>
{%if msg%}
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:place' %}"
</script>
{%endif%}
{% endblock %}
