{% extends 'User/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        td{
            color: aliceblue;
        }
    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 90%;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a; /* black background */
        color: #2a2a2a; /* white text */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    table th, table td {
        border: 1px solid #ff0000; /* red borders */
        padding: 12px 15px;
        text-align: center;
    }

    table tr:nth-child(even) {
        background-color: #2a2a2a;
    }

    table tr:hover {
        background-color: #400000; /* dark red on hover */
    }

    table th {
        background-color: #ff0000;
        color: #2a2a2a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
</head>
<body>
    <form action="" method="post">
        {%csrf_token%}
        <table border="1" align="center">
            <tr>
                <td>SL:NO</td>
                <td>Trainer</td>
                <td>Email</td>
                <td>contact</td>
               
                <td>Action</td>
            </tr>
            {%for i in assign %}
            <tr align="center">
                <td>{{forloop.counter}}</td>
                <td>{{i.trainer.trainer_name}}</td>
                <td>{{i.trainer.trainer_email}}</td>

                <td>{{i.trainer.trainer_contact}}</td>

                <td><a href="{% url 'User:chatpage' i.trainer.id %}">Chat</a>
                    <a href="{% url 'User:MyDiet' i.id %}">View Diet Plan</a></td>
            </tr>
            {% endfor %}
            </table>
    </form>

</body>
</html>
{% endblock %}
