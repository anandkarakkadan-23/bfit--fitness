{% extends 'User/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedBack</title>
</head>
<body>
    <h1 align="center">FeedBack</h1>
    <form action="" method="post">
        {%csrf_token%}
        <table align="center">
            <tr>
                <td>feedback</td>
                <td><textarea name="txt_feedback" id="txt_feedback"></textarea required placeholder="enter feedback"></td>
            </tr>
            <tr>
                <td><input type="submit" value="submit"></td>
                <td></td>
            </tr>
        </table>
        <br>
    <table border="1" align="center">
        <tr align="center">
            <td>SL:NO</td>
            <td>Content</td>
            <td>Date</td>
            <td>Action</td>
        </tr>
        {%for i in feed %}
        <tr align="center">
            <td>{{forloop.counter}}</td>
            <td>{{i.feedback_content}}</td>
            <td>{{i.feedback_date}}</td>
            <td><a href="{% url 'User:delfeedback' i.id %}">Delete</a></td>
        </tr>
        {%endfor%}
    </table>
    </form>
    
</body>
</html>
{% endblock %}
