{% extends 'User/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPlan</title>
    <style>
        td{
            color: aliceblue;
        }
    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 90%;
        font-family: Arial, sans-serif;
        background-color: #1a1a1a; /* black background */
        color: #2a2a2a; /* white text */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
    }

    table th, table td {
        border: 1px solid #ff0000; /* red borders */
        padding: 12px 15px;
        text-align: center;
    }

    table tr:nth-child(even) {
        background-color: #2a2a2a;
    }

    table tr:hover {
        background-color: #400000; /* dark red on hover */
    }

    table th {
        background-color: #ff0000;
        color: #2a2a2a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
    
    
</head>
<body>
    <h1 align="center">View GymPlan</h1>

    <form action="" method="post">  
        <table border="1" align="center">
            <tr>
                <td>SL NO</td>
                <td>Details</td>
                <td>Amount</td>
                <td>Action</td>
            </tr>
            {% for i in data %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.gymplan_details}}</td>
                <td>{{i.gymplan_amount}}</td>
                <td><a href="{% url 'User:Admission' i.id %}">Take Admission</a></td>
                <!-- <td><a href="{% url 'User:payment' i.id %}">payment</a></td> -->
            </tr>
            {% endfor %}
        </table>
    </form>
</body>
</html>
{% endblock %}
