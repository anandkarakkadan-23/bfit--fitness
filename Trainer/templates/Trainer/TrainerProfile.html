{% extends 'Trainer/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrainerProfile</title>
    <style>
        /* Table Styles */
        table {
            background-color: #f9f9f9; /* Light background color */
            width: 30%;                /* Optional: sets the width of the table */
            margin: 20px auto;         /* Centers the table */
            padding: 10px;             /* Adds padding inside the table */
            border-radius: 10px;
        }

        /* Table Header and Body Styles */
        td {
            padding: 10px;             /* Adds padding inside each table cell */
            vertical-align: middle;
            text-align: center;   /* Centers the content vertically */
        }

        /* Image Styles */
        img {
            width: 200px;              /* Sets the width of the user's photo */
            border-radius: 50%;        /* Optional: makes the image circular */
        }

        /* Links Styles */
        a {
            text-decoration: none;     /* Removes underline from links */
            color: #007bff;            /* Sets the link color */
            margin-right: 10px;        /* Adds space between the links */
        }

        a:hover {
            color: #0056b3;            /* Changes the color of links on hover */
        }

        /* Bold Text for Labels */
        td strong {
            font-weight: bold;         /* Makes labels bold */
        }
    </style>
</head>
<body>
    <h1 align="center">Trainerprofile</h1>
    <form action="" method="post">
        {%csrf_token%}
        <table align="center">
            <tr>
                <td colspan="2"><img src="{{data.Trainer_photo.url}}" alt="" width="200px"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <img src="{{data.trainer_photo.url}}" height="200" width="400">
                </td>
            </tr>
            <tr>
                <td>Name</td>
                <td>{{data.trainer_name}}</td>
            </tr>
            <tr>
                <td>Email</td>
                <td>{{data.trainer_email}}</td>
            </tr>
            <tr>
                <td>Contact</td>
                <td>{{data.trainer_contact}}</td>
            </tr>
            <tr>
                <td colspan="2"><a href="{% url 'Trainer:EditProfile' %}">EditProfile</a>
                    <a href="{% url 'Trainer:ChangePassword' %}">ChangePassword</a>
                </td>
  
            </tr>
        </table>
    </form>
</body>
</html>

{% endblock %}
